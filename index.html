<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Amazon Homepage(FAKE)</title>
   <!--set the style.css path-->
  <link rel="stylesheet" href="css/style.css">
</head>
<body id="top">
  <!-- top bar -->
  <div class="top-nav">
    <div class="container top-nav-inner">

      <!-- logo block -->
      <div class="logo">
        <a href="#">amazon</a>
      </div>

      <!-- search area -->
      <div class="search-area">
        <input type="text" class="search-input" placeholder="PLS type">
        <button class="search-button">search</button>
      </div>

      <!-- top bar-right-->
      <div class="nav-right">
        <a href="#">EN</a>
        <a href="#">Account</a>
        <a href="#">Orders</a>
        <a href="#">Cart</a>
      </div>
    </div>
  </div>

  <!-- sub bar -->
  <div class="sub-nav">
    <div class="container sub-nav-inner">

      <!-- left -->
      <div class="sub-nav-left">
        <ul>
          <li><a href="#">All</a></li>
          <li><a href="#">Today's Deals</a></li>
          <li><a href="#">Customer Service</a></li>
          <li><a href="#">Registry</a></li>
          <li><a href="#">Gift Cards</a></li>
          <li><a href="#">Sell</a></li>
        </ul>
      </div>
    </div>
  </div>

  <!-- top card -->
  <div class="top-card-section">
    <div class="container clearfix">

      <div class="top-card">
        <img src="jpg/photo.jpg" alt="Top card 1">
        <h3>type 1</h3>
        <p>game</p>
      </div>

      <div class="top-card">
        <img src="jpg/photo.jpg" alt="Top card 2">
        <h3>type 2</h3>
        <p>DVD</p>
      </div>

      <div class="top-card">
        <img src="jpg/photo.jpg" alt="Top card 3">
        <h3>type 3</h3>
        <p>cloth</p>
      </div>

      <div class="top-card">
        <img src="jpg/photo.jpg" alt="Top card 4">
        <h3>type 4</h3>
        <p>shoe</p>
      </div>

      <div class="top-card last">
        <img src="jpg/photo.jpg" alt="Top card 5">
        <h3>type 5</h3>
        <p>gun</p>
      </div>
    </div>
  </div>

</body>
</html>
